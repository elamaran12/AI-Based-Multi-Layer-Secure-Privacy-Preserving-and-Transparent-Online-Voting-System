<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SecureVote</title>
<style>
:root{--bg:#050b18;--p:#0e1a33cc;--b:#1f3a66;--a:#34d1ff;--g:#2ee59d;--y:#ffc233;--r:#ff4d6d;--t:#e6f0ff;--m:#8aa3c7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#12315f55,transparent),var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
canvas#bg{position:fixed;inset:0;z-index:0}main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:20px}
nav{display:flex;gap:10px;align-items:center;padding:14px 20px;position:relative;z-index:2;backdrop-filter:blur(8px);border-bottom:1px solid var(--b)}nav b{letter-spacing:.12em;color:var(--a);margin-right:auto}
a.l,button{cursor:pointer}.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:22px;margin:14px 0;backdrop-filter:blur(10px);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
h1{font-size:clamp(22px,4vw,38px);line-height:1.15;margin:40px 0 10px;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;color:transparent}
input{width:100%;padding:11px;margin:5px 0 12px;background:#07122a;border:1px solid var(--b);border-radius:8px;color:var(--t)}
label{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}
button{background:linear-gradient(135deg,#1d6fff,var(--a));color:#021;border:0;padding:11px 20px;border-radius:9px;font-weight:700}button.s{background:transparent;color:var(--a);border:1px solid var(--b)}button:disabled{opacity:.5}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.k{font-size:30px;font-weight:800}.LOW{color:var(--g)}.MEDIUM{color:var(--y)}.HIGH{color:var(--r)}
.otp{display:flex;gap:8px}.otp input{text-align:center;font-size:22px;padding:12px 0}.err{color:var(--r);min-height:20px}.ok{color:var(--g)}
.cand{cursor:pointer;border:2px solid var(--b);transition:.25s}.cand.sel{border-color:var(--a);box-shadow:0 0 24px #34d1ff55;transform:translateY(-3px)}
.blk{font:12px monospace;border-left:3px solid var(--a);padding:8px 12px;margin:0 0 0 12px;background:#07122a;word-break:break-all;animation:in .5s}
.bar{height:10px;border-radius:5px;background:#07122a;overflow:hidden}.bar i{display:block;height:100%;transition:width 1s}
.step{opacity:.35;transition:.4s}.step.on{opacity:1;color:var(--g)}table{width:100%;font:12px monospace;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid #12264a}
.tag{font-size:11px;background:#3a2a00;color:var(--y);padding:2px 8px;border-radius:5px}
</style></head><body><canvas id=bg></canvas>
<nav><b>SECUREVOTE</b><button class=s onclick="go('home')">Home</button><button class=s onclick="go('public')">Transparency</button><button class=s onclick="go('chain')">Blockchain</button><button class=s onclick="go('vlogin')">Voter</button><button class=s onclick="go('alogin')">Admin</button></nav>
<main id=app></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let T=localStorage.vt||'',AT='',cfg={},sel=null,timer;
const api=async(p,b,tok)=>{try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{data:j});return j}catch(e){if(e instanceof TypeError)e.message='Network error - server unreachable';throw e}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=(id,l,t='text')=>`<label>${l}</label><input id=${id} type=${t} autocomplete=off>`;const v=id=>$('#'+id).value;
function go(p){clearInterval(timer);({home,register,vlogin,otp,dash,vote,receipt:()=>{},public:pub,chain,alogin,admin,forgot})[p]();}
function home(){app.innerHTML=`<h1>AI-BASED MULTI-LAYER SECURE & PRIVACY-PRESERVING TRANSPARENT VOTING SYSTEM</h1><p style="color:var(--m);font-size:18px">Intelligent authentication. Privacy-preserving ballots. AI-driven threat detection. Blockchain-backed transparency.</p>
<p><button onclick="go('register')">Register to vote</button> <button class=s onclick="go('vlogin')">Voter sign-in</button></p>
<div class=card><b>Security pipeline</b><div id=pipe class=grid style="margin-top:12px"></div></div>
<div class=card style="color:var(--m)">Dynamic Trust Score: an Isolation Forest plus explainable rules scores each session. Risk level changes the verification required before a ballot is accepted.</div>`;
const st=['Identity','OTP','AI Trust Engine','Anonymous ballot','Encryption','SHA-256','Blockchain','Audit'];$('#pipe').innerHTML=st.map((s,i)=>`<div class=step id=s${i}>◆ ${s}</div>`).join('');st.forEach((_,i)=>setTimeout(()=>$('#s'+i)?.classList.add('on'),400*i))}
function register(){app.innerHTML=`<div class=card><h2>Voter registration</h2>${F('n','Full name')}${F('vi','Voter ID (ABC1234567)')}${F('m','Mobile (10 digits)','tel')}${F('e','Email','email')}${F('d','Date of birth','date')}${F('p','Password','password')}${F('p2','Confirm password','password')}
<p class=tag>Face enrolment not available in this build - see notes</p><p class=err id=er></p><button onclick=reg()>Create account</button></div>`}
async function reg(){if(v('p')!=v('p2'))return $('#er').textContent='Passwords do not match';try{await api('register',{name:v('n'),voter_id:v('vi').toUpperCase(),mobile:v('m'),email:v('e'),dob:v('d'),password:v('p')});go('vlogin')}catch(e){$('#er').textContent=e.message}}
function vlogin(){app.innerHTML=`<div class=card style="max-width:420px;margin:auto"><h2>Voter sign-in</h2>${F('vi','Voter ID')}${F('p','Password','password')}<p class=err id=er></p><button onclick=vl()>Continue</button> <button class=s onclick=register()>Register</button></div>`}
async function vl(){try{const r=await api('login',{voter_id:v('vi').toUpperCase(),password:v('p')});T=r.token;localStorage.vt=T;go('otp')}catch(e){$('#er').textContent=e.message}}
function otp(){app.innerHTML=`<div class=card style="max-width:440px;margin:auto"><h2>Verify your mobile</h2><p id=msg style="color:var(--m)">We will text a 6-digit code to your registered number.</p><button id=snd onclick=send()>Send OTP</button>
<div id=box style="display:none"><div class=otp id=o>${[0,1,2,3,4,5].map(i=>`<input maxlength=1 inputmode=numeric>`).join('')}</div><p id=cd class=tag></p><button onclick=ver()>Verify</button></div><p class=err id=er></p></div>`;
document.querySelectorAll('#o input').forEach((x,i,a)=>{x.oninput=()=>{if(x.value&&a[i+1])a[i+1].focus()};x.onkeydown=e=>{if(e.key=='Backspace'&&!x.value&&a[i-1])a[i-1].focus()};x.onpaste=e=>{const t=e.clipboardData.getData('text').replace(/\D/g,'');a.forEach((y,j)=>y.value=t[j]||'');e.preventDefault()}})}
async function send(){try{const r=await api('otp/send',{},T);$('#msg').innerHTML='Verification code sent to '+esc(r.masked)+(r.mode=='demo'?' <span class=tag>'+esc(r.notice)+'</span>':'');$('#snd').disabled=true;$('#box').style.display='block';$('#er').textContent='';let t=30;clearInterval(timer);timer=setInterval(()=>{t--;$('#cd').textContent=t>0?`Resend in ${t}s`:'You can resend now';if(t<=0){clearInterval(timer);$('#snd').disabled=false;$('#snd').textContent='Resend OTP'}},1000)}catch(e){$('#er').textContent=e.message}}
async function ver(){const c=[...document.querySelectorAll('#o input')].map(x=>x.value).join('');try{await api('otp/verify',{code:c},T);$('#app .card').innerHTML='<h2 class=ok>✓ Verified</h2>';setTimeout(()=>go('dash'),700)}catch(e){$('#er').textContent=e.message+(e.data?.attempts_left!=null?` (${e.data.attempts_left} left)`:'');$('#o').style.animation='shake .4s';setTimeout(()=>$('#o').style.animation='',500)}}
function trustHTML(t){return `<div class=card><b>AI TRUST ENGINE</b><div class=grid style="margin-top:10px"><div>Trust score<div class="k ${t.risk}">${t.score}/100</div></div><div>Risk<div class="k ${t.risk}">${t.risk}</div></div><div>Security level<div class=k>${t.security}</div></div><div>Anomalies<div class=k>${t.reasons.length}</div></div></div>
<div class=bar style="margin:12px 0"><i class="${t.risk}" style="width:${t.score}%;background:currentColor"></i></div><div style="color:var(--m)">Required: ${t.required.map(esc).join(' + ')}</div>${t.reasons.map(r=>'<div class=HIGH>⚠ '+esc(r)+'</div>').join('')}<details><summary style="color:var(--m)">Session features</summary><pre>${esc(JSON.stringify(t.features,null,1))}</pre></details></div>`}
async function dash(){try{const m=await api('me',null,T);let h=`<h2>Welcome, ${esc(m.name)}</h2><div class=grid><div class=card>Election<div class=k style="font-size:18px">${esc(m.election.name)}</div>${m.election.id} · ${m.election.status}<br>${Math.floor(m.election.remaining/3600)}h left</div><div class=card>Authentication<div class=k style="font-size:18px" class=${m.otp_verified?'ok':''}>${m.otp_verified?'✓ OTP verified':'OTP pending'}</div></div><div class=card>Voting<div class=k style="font-size:18px">${m.has_voted?'Ballot recorded':'Not voted'}</div></div></div>`+trustHTML(m.trust);
if(m.trust.risk=='HIGH')h+=`<div class=card style="border-color:var(--r)"><b class=HIGH>AI SECURITY ANALYSIS - voting restricted</b><p>Temporary voting restriction activated. Session recorded for review.</p></div>`;
else if(!m.otp_verified)h+=`<button onclick=go('otp')>Verify mobile</button>`;
else if(m.trust.risk=='MEDIUM'&&!m.otp2_verified)h+=`<div class=card><b class=MEDIUM>ELEVATED: additional verification required</b><p>A second OTP confirms this session.</p><button onclick="go('otp2')">Verify again</button></div>`;
else if(!m.has_voted)h+=`<button onclick="go('vote')">Enter election</button>`;app.innerHTML=h}catch(e){app.innerHTML=`<div class=card><b class=err>${esc(e.message)}</b><br><button onclick="go('vlogin')">Sign in</button></div>`}}
window.otp2=otp;const _go=go;
async function vote(){const c=await api('candidates');app.innerHTML=`<h2>Select your candidate</h2><div class=grid>${c.map(x=>`<div class="card cand" data-id=${x.id}><div style="font-size:40px">👤</div><b>${esc(x.name)}</b><div style="color:var(--a)">${esc(x.party)}</div><div style="color:var(--m)">${esc(x.bio)}</div></div>`).join('')}</div><button id=rv disabled>Review selection</button>`;
document.querySelectorAll('.cand').forEach(el=>el.onclick=()=>{document.querySelectorAll('.cand').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');sel=+el.dataset.id;$('#rv').disabled=false;sel_name=el.querySelector('b').textContent});
$('#rv').onclick=()=>{app.innerHTML=`<div class=card><h2>Review your vote</h2><p>You selected <b>${esc(sel_name)}</b>. This cannot be changed.</p><p class=err id=er></p><button onclick=conf()>Confirm vote</button> <button class=s onclick="go('vote')">Back</button></div>`}}
let sel_name='';
async function conf(){const S=['Validating voter','Generating anonymous ballot','Encrypting vote','Generating SHA-256 hash','Validating transaction','Adding to blockchain'];app.innerHTML=`<div class=card><h2>Processing</h2>${S.map((s,i)=>`<div class=step id=p${i}>◆ ${s}</div>`).join('')}<p class=err id=er></p></div>`;
let i=0;const tk=setInterval(()=>{$('#p'+i)?.classList.add('on');i++},350);try{const r=await api('vote',{candidate_id:sel},T);S.forEach((_,k)=>$('#p'+k)?.classList.add('on'));clearInterval(tk);setTimeout(()=>{app.innerHTML=`<div class=card><h2 class=ok>✓ VOTE SUCCESSFULLY RECORDED</h2><p>Anonymous Ballot ID<br><b>${esc(r.ballot_id)}</b></p><p>Transaction ID<br><b>${esc(r.tx)}</b></p><p>Blockchain hash<br><code style="word-break:break-all">${esc(r.hash)}</code></p><p style="color:var(--m)">Your candidate choice is not shown on this receipt.</p><button onclick="go('chain')">View ledger</button></div>`},700)}catch(e){clearInterval(tk);$('#er').textContent=e.message;if(e.data?.analysis)app.innerHTML+=trustHTML(e.data.analysis)}}
async function pub(){const p=await api('public');app.innerHTML=`<h2>PUBLIC ELECTION TRANSPARENCY</h2><div class=grid><div class=card>Election<div class=k style="font-size:18px">${esc(p.election)}</div>${p.status}</div><div class=card>Registered<div class=k>${p.registered}</div></div><div class=card>Votes<div class=k>${p.votes}</div></div><div class=card>Ledger<div class="k ${p.chain_valid?'LOW':'HIGH'}" style="font-size:18px">${p.chain_valid?'✓ Verified':'✗ TAMPERED'}</div></div></div>${p.results?`<div class=card><b>Final results</b>${p.results.map(r=>`<p>${esc(r.candidate)}: ${r.votes}</p>`).join('')}</div>`:'<div class=card style="color:var(--m)">Results are published after the election closes.</div>'}`}
async function chain(){const c=await api('chain');app.innerHTML=`<h2>Blockchain explorer</h2><button onclick=vc()>Verify integrity</button><div id=vr></div><div style="margin-top:14px">${c.blocks.length?c.blocks.map(b=>`<div class=blk><b>BLOCK #${b.idx}</b> · ${esc(b.ts)}<br>prev ${esc(b.prev.slice(0,24))}…<br>hash ${esc(b.hash.slice(0,24))}…<br>${esc(b.ballot_id)} · ${esc(b.tx)}<br>enc ref ${esc(b.enc_ref.slice(0,24))}…</div><div style="margin-left:20px;color:var(--a)">↓</div>`).join(''):'<div class=card>No blocks yet.</div>'}</div>`}
async function vc(){const r=await api('chain/verify');$('#vr').innerHTML=`<div class=card>${r.valid?'<b class=LOW>✓ Chain valid</b>':'<b class=HIGH>✗ Integrity failure</b>'}<br>${r.detail.map(d=>`#${d.block}: ${d.hash_ok?'✓':'✗'} hash ${d.prev_ok?'✓':'✗'} prev-hash ${d.ballot_ok?'✓':'✗'} ballot`).join('<br>')}</div>`}
function alogin(){app.innerHTML=`<div class=card style="max-width:420px;margin:auto"><h2>Administrator sign-in</h2>${F('u','Username')}${F('p','Password','password')}<p class=err id=er></p><button onclick=al()>Sign in</button> <button class=s onclick=forgot()>Forgot password</button></div>`}
async function al(){try{AT=(await api('admin/login',{username:v('u'),password:v('p')})).token;admin()}catch(e){$('#er').textContent=e.message}}
function forgot(){app.innerHTML=`<div class=card style="max-width:420px;margin:auto"><h2>Reset admin password</h2>${F('em','Registered admin email')}<button onclick="api('admin/forgot',{email:v('em')}).then(r=>$('#er').textContent=r.msg)">Request reset</button><hr>${F('tk','Reset token')}${F('np','New password','password')}<button onclick="api('admin/reset',{token:v('tk'),password:v('np')}).then(()=>go('alogin')).catch(e=>$('#er').textContent=e.message)">Set password</button><p class=err id=er></p></div>`}
async function admin(){if(!AT)return alogin();try{const [s,a,vs]=await Promise.all([api('admin/stats',null,AT),api('admin/audit',null,AT),api('admin/voters',null,AT)]);const tot=s.risk.LOW+s.risk.MEDIUM+s.risk.HIGH||1;
app.innerHTML=`<h2>Operations dashboard</h2><div class=grid>${[['Voters',s.voters],['Active sessions',s.active],['Votes cast',s.votes],['Blockchain tx',s.votes],['AI alerts',s.alerts],['High-risk',s.risk.HIGH]].map(([l,n])=>`<div class=card>${l}<div class=k data-n=${n}>0</div></div>`).join('')}</div>
<div class=grid><div class=card><b>Risk distribution</b>${['LOW','MEDIUM','HIGH'].map(k=>`<div>${k} ${Math.round(100*s.risk[k]/tot)}%<div class=bar><i class=${k} style="width:${100*s.risk[k]/tot}%;background:currentColor"></i></div></div>`).join('')}</div>
<div class=card><b>Trust score distribution</b>${s.score_hist.map((n,i)=>`<div>${i*20}-${i*20+20}<div class=bar><i style="width:${Math.min(100,n*20)}%;background:var(--a)"></i></div></div>`).join('')}</div></div>
<div class=card><button onclick="api('admin/close',{},AT).then(admin)">Close election &amp; tally</button> <button class=s onclick=vc2()>Verify blockchain</button><div id=vr></div></div>
<div class=card><b>Election &amp; candidates</b><div class=grid style="margin-top:8px"><div>${F('en','Election name')}${F('eh','Duration (hours)','number')}<button onclick="api('admin/election',{name:v('en'),hours:v('eh')},AT).then(admin).catch(e=>alert(e.message))">Save election (reopens it)</button></div><div>${F('cn','Candidate name')}${F('cp','Party')}${F('cb','Short bio')}<button onclick="api('admin/candidate',{name:v('cn'),party:v('cp'),bio:v('cb')},AT).then(admin).catch(e=>alert(e.message))">Add candidate</button></div></div><div id=cl style="margin-top:10px"></div></div>
<div class=card><b>Live security feed</b><table>${a.map(x=>`<tr><td>${x.ts}</td><td>${esc(x.type)}</td><td>${esc(x.sid)}</td><td class=${x.risk}>${esc(x.risk)}</td><td>${esc(x.msg)}</td></tr>`).join('')}</table></div>
<div class=card><b>Voters</b><table>${vs.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.voter_id)}</td><td>${esc(x.mobile)}</td><td>${x.has_voted?'voted':'-'}</td></tr>`).join('')}</table></div>`;
api('candidates').then(c=>{$('#cl').innerHTML=c.map(x=>`<div>${esc(x.name)} <span style=color:var(--m)>${esc(x.party)}</span> <button class=s onclick="api('admin/candidate/delete',{id:${x.id}},AT).then(admin).catch(e=>alert(e.message))">Remove</button></div>`).join('')});
document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;let i=0;const t=setInterval(()=>{i++;el.textContent=Math.round(n*i/20);if(i>=20)clearInterval(t)},30)});
timer=setInterval(async()=>{if(!$('table'))return clearInterval(timer);const a=await api('admin/audit',null,AT);$('table').innerHTML=a.map(x=>`<tr><td>${x.ts}</td><td>${esc(x.type)}</td><td>${esc(x.sid)}</td><td class=${x.risk}>${esc(x.risk)}</td><td>${esc(x.msg)}</td></tr>`).join('')},4000)}catch(e){AT='';alogin();$('#er').textContent=e.message}}
async function vc2(){const r=await api('chain/verify');$('#vr').innerHTML=r.valid?'<b class=LOW>✓ Chain valid ('+r.blocks+' blocks)</b>':'<b class=HIGH>✗ Integrity failure</b>'}
// background: drifting network canvas
const cv=$('#bg'),x=cv.getContext('2d');let W,H,P=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/18)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}rs();onresize=rs;
(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;x.fillStyle='#34d1ff';x.fillRect(p.x,p.y,2,2)});for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<130){x.strokeStyle=`rgba(52,209,255,${.18*(1-d/130)})`;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}requestAnimationFrame(f)})();
home();
</script>
<script>
// ===================== Election management UI (overrides earlier definitions) =====================
document.head.insertAdjacentHTML('beforeend','<style>select,textarea{width:100%;padding:11px;margin:5px 0 12px;background:#07122a;border:1px solid var(--b);border-radius:8px;color:var(--t);font:inherit}@keyframes pl{50%{box-shadow:0 0 26px var(--a)}}.tbl{overflow-x:auto}.tbl table{font:13px system-ui;min-width:760px}.tbl th{text-align:left;color:var(--m);font-size:11px;letter-spacing:.08em;padding:6px}.tbl td{padding:8px 6px;vertical-align:middle}button.sm{padding:5px 11px;font-size:12px;margin:2px}.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#12264a;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--a)}</style>');
const ST={DRAFT:'#8aa3c7',SCHEDULED:'#ffc233',ACTIVE:'#2ee59d',PAUSED:'#ff9f43',CLOSED:'#ff4d6d'};
const badge=s=>`<span style="border:1px solid ${ST[s]};color:${ST[s]};padding:2px 10px;border-radius:99px;font-size:11px;letter-spacing:.08em">${s==='ACTIVE'?'● ':''}${s}</span>`;
const fd=t=>new Date(t*1000).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
async function api2(p,b,m,tok){try{const r=await fetch('/api/'+p,{method:m||(b?'POST':'GET'),headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{data:j});return j}catch(e){if(e instanceof TypeError)e.message='Network error - server unreachable';throw e}}
const A=(p,b,m)=>api2(p,b,m,AT);
function modal(h){let m=document.getElementById('md');if(!m){m=document.createElement('div');m.id='md';m.style.cssText='position:fixed;inset:0;z-index:10;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px';document.body.appendChild(m)}m.style.display='flex';m.innerHTML=`<div class=card style="max-width:760px;width:100%;max-height:92vh;overflow:auto;margin:0">${h}</div>`}
const closeM=()=>{const m=document.getElementById('md');if(m)m.style.display='none'};
function confirmBox(title,body,need,label,fn){modal(`<h3 style="margin-top:0">${title}</h3>${body}${need?`<label>Type "${esc(need)}" to confirm</label><input id=cf autocomplete=off>`:''}<p class=err id=cer></p><button class=s onclick=closeM()>Cancel</button> <button id=cok>${label}</button>`);$('#cok').onclick=async()=>{const t=need?v('cf'):'';if(need&&t!==need)return $('#cer').textContent='Confirmation text does not match';$('#cok').disabled=true;try{await fn(t);closeM()}catch(e){$('#cer').textContent=e.message;$('#cok').disabled=false}}}

async function faceV(){app.innerHTML=camBox('FACE VERIFICATION','Position your face inside the frame.');
try{await startCam();const d=await grabFace();if(!d)return;setSt('MATCHING BIOMETRIC IDENTITY…');ringC('var(--a)');const r=await api('face/verify',{descriptor:d},T);Cam.stop();setSt(`✓ FACE VERIFIED - match confidence ${r.confidence}%`,'ok');ringC('var(--g)');setTimeout(route,1100)}
catch(e){if(e.data){Cam.stop();setSt('✕ '+e.message,'HIGH');ringC('var(--r)');$('#er').textContent=e.data.attempts_left!=null?`${e.data.attempts_left} attempt(s) remaining`:'';$('#cbtn').innerHTML=e.data.attempts_left==null&&!/MISMATCH/.test(e.message)?`<button class=s onclick=signOut()>Back to sign-in</button>`:`<button onclick="route()">Try again</button> <button class=s onclick=signOut()>Cancel</button>`}else camFail(e,'route()')}}
async function live(){app.innerHTML=camBox('LIVENESS CHECK','Follow each instruction to prove you are a live person.');
try{const ch=await api('liveness/start',{},T);$('#csteps').innerHTML=ch.steps.map((s,i)=>`<div class=step id=es${i}>◆ ${TXT[s]}</div>`).join('');await startCam();const R=[];
for(let i=0;i<ch.steps.length;i++){const r=await doStep(ch.steps[i],true,20000);if(!r)return;R.push({step:ch.steps[i],...r});$('#es'+i).classList.add('on');setSt('✓ Verified','ok')}
setSt('Verifying…');Cam.stop();await api('liveness/verify',{nonce:ch.nonce,results:R},T);setSt('✓ LIVE PERSON VERIFIED','ok');ringC('var(--g)');setTimeout(route,1100)}
catch(e){if(e.data?.analysis){Cam.stop();return route()}Cam.stop();$('#er').textContent=e.message+(e.data?.attempts_left!=null?` (${e.data.attempts_left} attempt(s) left)`:'');setSt('✕ Liveness check failed','HIGH');$('#cbtn').innerHTML=`<button onclick="route()">Try again</button> <button class=s onclick=signOut()>Cancel</button>`}}
async function blockedS(m){app.innerHTML=`<div class=card style="max-width:560px;margin:auto;border-color:var(--r)"><h2 class=HIGH style="margin-top:0">AI SECURITY ANALYSIS</h2>${m.status=='LOCKED'||m.status=='SUSPENDED'?`<p>Your account is <b>${esc(m.status)}</b>. Contact the election administrator.</p>`:`<p><b>Action:</b> Voting access is temporarily restricted. Additional verification and a security review are required.</p>`}</div><div style="max-width:560px;margin:auto">${trustHTML(m.trust)}</div><p style="text-align:center"><button class=s onclick=signOut()>Return to sign-in</button></p>`}
// ---- forgot password
let RS={};
function vforgot(){RS={};app.innerHTML=`<div class=card style="max-width:440px;margin:auto"><h2 style="margin-top:0">Reset your password</h2><p style="color:var(--m)">Enter your mobile number, voter ID or email. You will verify with an SMS code and your face.</p>${F('id','Mobile / Voter ID / Email')}<p class=err id=er></p><button onclick=rf1()>Continue</button> <button class=s onclick="vlogin()">Back</button></div>`}
async function rf1(){try{const r=await api('pw/forgot',{identifier:v('id')});RS={tk:r.token,masked:r.masked};app.innerHTML=`<div class=card style="max-width:440px;margin:auto"><h2 style="margin-top:0">VERIFY YOUR IDENTITY</h2><p id=msg style="color:var(--m)">If this account exists, a code will be sent to ${esc(r.masked)}.</p><button id=snd onclick=rf2()>SEND OTP</button><div id=box style="display:none;margin-top:14px">${otpBoxes()}<p id=cd class=tag></p><button onclick=rf3()>VERIFY OTP</button></div><p class=err id=er></p></div>`;wireBoxes()}catch(e){$('#er').textContent=e.message}}
async function rf2(){try{const r=await api('pw/otp',{token:RS.tk});$('#msg').innerHTML='If this account exists, a code was sent to <b>'+esc(RS.masked)+'</b>'+(r.mode=='demo'?' <span class=tag>'+esc(r.notice)+'</span>':'');$('#box').style.display='block';otpTimers(r.expires_in||180)}catch(e){$('#er').textContent=e.message}}
async function rf3(){try{await api('pw/otp/verify',{token:RS.tk,code:codeVal()});clearInterval(timer);rf4()}catch(e){$('#er').textContent=e.message+(e.data?.attempts_left!=null?` (${e.data.attempts_left} left)`:'');$('#o').style.animation='shake .4s';setTimeout(()=>{const o=$('#o');if(o)o.style.animation=''},500)}}
async function rf4(){app.innerHTML=camBox('FACE VERIFICATION','Confirm it is you before choosing a new password.');
try{await startCam();const d=await grabFace();if(!d)return;setSt('MATCHING BIOMETRIC IDENTITY…');const r=await api('pw/face',{token:RS.tk,descriptor:d});Cam.stop();setSt(`✓ FACE VERIFIED (${r.confidence}%)`,'ok');setTimeout(rf5,1000)}
catch(e){if(e.data){Cam.stop();setSt('✕ '+e.message,'HIGH');$('#cbtn').innerHTML=(e.data.attempts_left===0||e.status==429)?'<button class=s onclick=vlogin()>Back to sign-in</button>':'<button onclick=rf4()>Try again</button>'}else camFail(e,'rf4()')}}
function rf5(){app.innerHTML=`<div class=card style="max-width:440px;margin:auto"><h2 style="margin-top:0">Create new password</h2>${F('p','New password','password')}${meter('pm')}${F('p2','Confirm password','password')}<p class=err id=er></p><button onclick=rf6()>Update password</button></div>`;$('#p').oninput=e=>pwMeter('pm',e.target.value)}
async function rf6(){if(v('p')!==v('p2'))return $('#er').textContent='Passwords do not match';if(pwScore(v('p'))<5)return $('#er').textContent='Password needs 8+ characters with upper, lower, number and special character';try{await api('pw/reset',{token:RS.tk,password:v('p')});app.innerHTML=`<div class=card style="max-width:440px;margin:auto;text-align:center"><h2 class=ok>✓ PASSWORD UPDATED SUCCESSFULLY</h2><button onclick="vlogin('Password updated. Sign in with your new password.')">RETURN TO LOGIN</button></div>`}catch(e){$('#er').textContent=e.message}}
</script></body></html>
